<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Zion Farm · Memória do cultivo</title>
<style>:root{--fundo:#3F3B16;--fundo-externo:#2A2710;--superficie:#4c4926;--texto:#FFFFFF;--texto-suave:#E4DFC4;--primaria:#E18727;--texto-primaria:#15140E;--primaria-sombra:#925819;--destaque:#FFF0C7;--destaque-fraco:#FFF0C740;--acerto:#2F8F4E;--erro:#C8352B;--linha:#625e40;--teclado-fundo:#29260e;--teclado-tecla:#5a5637;--teclado-texto:#FFFFFF;--fonte-titulo:Archivo, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;--fonte-texto:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;}
/* ============================================================
   MOTOR — base visual
   As cores e fontes vêm do config do cliente (injetadas como
   variáveis em :root pelo build). Nada aqui sabe o nome de cliente.
   Unidade de desenho: palco 1080×1920 (retrato) ou 1920×1080
   (paisagem), escalado para caber em qualquer tela.
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--fundo-externo, #000);
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
body { font-family: var(--fonte-texto); color: var(--texto); }

#palco {
  position: absolute; left: 50%; top: 50%;
  transform-origin: 0 0;
  background: var(--fundo);
  overflow: hidden;
}
#palco.retrato  { width: 1080px; height: 1920px; }
#palco.paisagem { width: 1920px; height: 1080px; }

/* ---------- telas ---------- */
.tela {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  padding: 96px 88px;
  opacity: 0; visibility: hidden;
  transition: opacity 320ms ease, visibility 0s linear 320ms;
}
.tela.on { opacity: 1; visibility: visible; transition: opacity 320ms ease; }
.paisagem .tela { padding: 64px 140px; }

.topo { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 96px; }
.topo .logo { height: 96px; width: auto; object-fit: contain; }
.voltar {
  font: 600 30px/1 var(--fonte-texto); color: var(--texto-suave);
  background: none; border: 0; padding: 24px 8px; letter-spacing: .06em;
}

.kicker { font: 600 30px/1.2 var(--fonte-texto); letter-spacing: .14em; text-transform: uppercase; color: var(--destaque); margin: 0 0 20px; }
h1, h2 { font-family: var(--fonte-titulo); margin: 0; line-height: 1.02; letter-spacing: -.01em; }
h1 { font-size: 132px; font-weight: 800; }
h2 { font-size: 80px; font-weight: 800; }
.paisagem h1 { font-size: 112px; }
.lede { font-size: 40px; line-height: 1.35; color: var(--texto-suave); margin: 28px 0 0; max-width: 880px; }

/* ---------- botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 16px;
  min-height: 128px; padding: 0 64px; border-radius: 999px; border: 0;
  font: 800 44px/1 var(--fonte-titulo); letter-spacing: .01em;
  background: var(--primaria); color: var(--texto-primaria);
  box-shadow: 0 10px 0 var(--primaria-sombra), 0 18px 40px rgba(0,0,0,.25);
  transition: transform 90ms ease, box-shadow 90ms ease, opacity 200ms;
}
.btn:active { transform: translateY(8px); box-shadow: 0 2px 0 var(--primaria-sombra), 0 8px 20px rgba(0,0,0,.2); }
.btn[disabled] { opacity: .35; }
.btn.sec { background: transparent; color: var(--texto); box-shadow: inset 0 0 0 4px var(--linha); }
.btn.sec:active { transform: translateY(2px); }
.btn.largo { width: 100%; }
.acoes { display: flex; gap: 28px; margin-top: auto; }
.acoes .btn { flex: 1; }

/* ---------- ESPERA ---------- */
#espera { justify-content: space-between; align-items: center; text-align: center; padding-top: 140px; padding-bottom: 120px; }
#espera .video-fundo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
#espera .veu { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.45)); z-index: 0; }
#espera > *:not(.video-fundo):not(.veu) { position: relative; z-index: 1; }
#espera .logo-grande { height: 220px; width: auto; max-width: 80%; object-fit: contain; animation: flutua 4.2s ease-in-out infinite; }
#espera .miolo { display: flex; flex-direction: column; align-items: center; }
#espera .lede { margin-left: auto; margin-right: auto; }
#espera .chamada { animation: pulsa 1.6s ease-in-out infinite; }
#espera .dica { font-size: 30px; color: var(--texto-suave); margin-top: 36px; letter-spacing: .04em; }
#espera .faixa-ranking { width: 100%; max-width: 900px; }

@keyframes flutua { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }
@keyframes pulsa  { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }

/* ---------- CADASTRO ---------- */
#cadastro .form { display: flex; flex-direction: column; gap: 26px; margin-top: 36px; flex: 1; min-height: 0; overflow-y: auto; padding: 4px 12px 24px 4px; }
.campo label { display: block; font: 600 30px/1.2 var(--fonte-texto); color: var(--texto-suave); margin: 0 0 10px 8px; }
.campo input {
  width: 100%; height: 112px; padding: 0 36px; border-radius: 28px;
  border: 4px solid var(--linha); background: var(--superficie); color: var(--texto);
  font: 600 42px/1 var(--fonte-texto); outline: none; caret-color: var(--destaque);
}
.campo input.foco { border-color: var(--destaque); box-shadow: 0 0 0 8px var(--destaque-fraco); }
.campo input.erro { border-color: var(--erro); }
.campo .msg { font-size: 26px; color: var(--erro); margin: 8px 0 0 8px; min-height: 30px; }
.consent { display: flex; gap: 24px; align-items: flex-start; font-size: 30px; line-height: 1.35; color: var(--texto-suave); padding: 8px 4px; }
.consent .caixa {
  flex: 0 0 64px; height: 64px; border-radius: 16px; border: 4px solid var(--linha);
  background: var(--superficie); display: grid; place-items: center; font-size: 44px; color: var(--texto-primaria);
}
.consent.marcado .caixa { background: var(--primaria); border-color: var(--primaria); }
.consent small { display: block; font-size: 24px; opacity: .8; margin-top: 6px; word-break: break-all; }
#cadastro .acoes { margin-top: 28px; }

/* ---------- TECLADO PRÓPRIO ---------- */
.teclado {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--teclado-fundo); padding: 22px 18px 34px;
  transform: translateY(105%); transition: transform 240ms ease;
  box-shadow: 0 -12px 40px rgba(0,0,0,.25);
}
.teclado.on { transform: translateY(0); }
.teclado .linha { display: flex; justify-content: center; gap: 12px; margin-bottom: 12px; }
.teclado button {
  flex: 1; max-width: 96px; height: 104px; border: 0; border-radius: 18px;
  background: var(--teclado-tecla); color: var(--teclado-texto);
  font: 600 40px/1 var(--fonte-texto);
}
.teclado button:active { background: var(--destaque); color: var(--texto-primaria); }
.teclado button.w2 { max-width: 200px; flex: 2; }
.teclado button.w4 { max-width: 460px; flex: 5; }
.teclado button.ok { background: var(--primaria); color: var(--texto-primaria); max-width: 220px; flex: 2; }
.teclado.numerico button { max-width: 300px; height: 118px; font-size: 52px; }
.tela.com-teclado { padding-bottom: 620px; }
.paisagem .tela.com-teclado { padding-bottom: 560px; }

/* ---------- LEITURA ---------- */
#leitura .corpo { flex: 1; overflow-y: auto; margin: 36px 0 32px; padding-right: 12px; -webkit-overflow-scrolling: touch; }
#leitura .bloco { background: var(--superficie); border-radius: 32px; padding: 40px 44px; margin-bottom: 24px; }
#leitura .bloco h3 { font: 800 44px/1.15 var(--fonte-titulo); margin: 0 0 14px; color: var(--destaque); }
#leitura .bloco p { font-size: 36px; line-height: 1.45; margin: 0; }

/* ---------- JOGO (moldura comum) ---------- */
#jogo { padding-top: 72px; }
#jogo .area { flex: 1; display: flex; flex-direction: column; min-height: 0; }

/* ---------- RESULTADO ---------- */
#resultado { align-items: center; text-align: center; justify-content: center; gap: 12px; }
#resultado .selo { font-size: 180px; line-height: 1; animation: estoura 600ms cubic-bezier(.2,1.6,.4,1) both; }
#resultado .placar { font: 800 60px/1 var(--fonte-titulo); margin-top: 28px; color: var(--destaque); }
#resultado .brinde {
  margin-top: 48px; width: 100%; max-width: 860px; background: var(--superficie);
  border: 4px dashed var(--destaque); border-radius: 36px; padding: 44px;
  animation: sobe 520ms 280ms ease both;
}
#resultado .brinde .foto { display: block; width: 260px; height: 260px; object-fit: contain; border-radius: 28px; margin: 0 auto 22px; background: var(--fundo); }
#resultado .brinde .nome { font: 800 58px/1.1 var(--fonte-titulo); }
#resultado .brinde .codigo { font: 800 96px/1 ui-monospace, Menlo, monospace; letter-spacing: .12em; color: var(--destaque); margin-top: 20px; }
#resultado .brinde .instr { font-size: 30px; color: var(--texto-suave); margin-top: 18px; }
#resultado .posicao { font-size: 34px; margin-top: 30px; color: var(--texto-suave); }
#resultado .acoes { width: 100%; max-width: 860px; margin-top: 56px; }
#resultado .contagem { font-size: 26px; color: var(--texto-suave); margin-top: 22px; }
@keyframes estoura { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes sobe { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- RANKING ---------- */
.ranking { list-style: none; margin: 0; padding: 0; text-align: left; }
.ranking li { display: flex; gap: 20px; align-items: center; padding: 16px 28px; border-radius: 20px; font-size: 32px; }
.ranking li:nth-child(odd) { background: var(--superficie); }
.ranking .pos { font: 800 36px/1 var(--fonte-titulo); width: 56px; color: var(--destaque); }
.ranking .nome { flex: 1; }
.ranking .pts { font-weight: 700; }
.ranking li.eu { outline: 4px solid var(--destaque); }

/* ---------- AVISO DE INATIVIDADE ---------- */
#inativo {
  position: absolute; inset: 0; z-index: 60; background: rgba(0,0,0,.72);
  display: none; align-items: center; justify-content: center; text-align: center; color: #fff;
}
#inativo.on { display: flex; }
#inativo .caixa { background: var(--fundo); color: var(--texto); border-radius: 40px; padding: 72px 80px; max-width: 840px; }
#inativo .n { font: 800 150px/1 var(--fonte-titulo); color: var(--destaque); margin: 24px 0; }

/* ---------- CANTO SECRETO DO ADMIN ---------- */
#canto-admin { position: absolute; width: 140px; height: 140px; z-index: 70; }

/* ---------- FAIXA DE RASCUNHO ---------- */
#rascunho {
  position: absolute; top: 0; left: 0; right: 0; z-index: 90; pointer-events: none;
  background: #C8102E; color: #fff; text-align: center; font: 700 24px/1.3 system-ui, sans-serif; padding: 10px;
}

/* ---------- CONFETE ---------- */
#confete { position: absolute; inset: 0; z-index: 50; pointer-events: none; }

/* ---------- espera na tela deitada ---------- */
.paisagem #espera { padding-top: 64px; padding-bottom: 56px; }
.paisagem #espera .logo-grande { height: 150px; }
.paisagem #espera .faixa-ranking { max-width: 760px; margin: 20px 0; }
.paisagem #espera .ranking li { padding: 10px 24px; font-size: 28px; }
</style>

<script>/* nucleo/estado.js */
/* ============================================================
   ESTADO — config do cliente, gravação local e regras de brinde.
   Tudo fica no aparelho (localStorage). Nada sai pela rede.
   ============================================================ */
(function () {
  const J = (window.J = window.J || {});
  const cfg = (J.cfg = window.__CONFIG__);
  J.jogos = J.jogos || {};

  /* ---------- utilidades ---------- */
  const u = (J.u = {});
  u.$ = (sel, raiz) => (raiz || document).querySelector(sel);
  u.$$ = (sel, raiz) => Array.from((raiz || document).querySelectorAll(sel));
  u.esc = (s) =>
    String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  u.embaralhar = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  u.hoje = () => {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };
  u.hora = (iso) => new Date(iso).toLocaleString('pt-BR');
  // Código de retirada: sem 0/O/1/I para ninguém confundir no balcão.
  u.codigo = () => {
    const letras = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let c = '';
    for (let i = 0; i < 5; i++) c += letras[Math.floor(Math.random() * letras.length)];
    return c;
  };
  // Hash do PIN do admin. Não é cofre: é só para o PIN não ficar legível no HTML.
  u.hashPin = (sal, pin) => {
    let h = 0x811c9dc5;
    const s = sal + ':' + pin;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h.toString(16).padStart(8, '0');
  };
  // Nome para exibir em público: primeiro nome + inicial do sobrenome.
  u.nomePublico = (nome) => {
    const p = String(nome || '').trim().split(/\s+/);
    if (!p[0]) return 'Jogador';
    return p.length > 1 ? p[0] + ' ' + p[p.length - 1][0].toUpperCase() + '.' : p[0];
  };

  /* ---------- gravação local ---------- */
  const CHAVE = 'jg_' + cfg.cliente.slug + '_v1';
  function carregar() {
    try {
      const d = JSON.parse(localStorage.getItem(CHAVE));
      if (d && Array.isArray(d.leads)) return d;
    } catch (e) {}
    return { leads: [], estoque: {}, chances: {}, ajustes: {}, sorteios: [] };
  }
  const dados = (J.dados = carregar());
  dados.chances = dados.chances || {};
  dados.ajustes = dados.ajustes || {};
  dados.sorteios = dados.sorteios || [];
  // Brinde novo no config entra com o estoque do config; o que já existe
  // mantém o que o operador ajustou no admin durante o evento.
  (cfg.brindes || []).forEach((b) => {
    if (!(b.id in dados.estoque)) dados.estoque[b.id] = b.estoque;
  });

  J.salvar = () => {
    try {
      localStorage.setItem(CHAVE, JSON.stringify(dados));
      return true;
    } catch (e) {
      // Sem espaço ou armazenamento bloqueado: avisa o operador, não o jogador.
      console.error('Falha ao gravar', e);
      J.falhaGravacao = true;
      return false;
    }
  };
  J.salvar();

  J.ajuste = (chave, padrao) => (chave in dados.ajustes ? dados.ajustes[chave] : padrao);

  /* ---------- brindes ---------- */
  J.brindes = {
    lista() {
      return (cfg.brindes || []).map((b) => ({
        ...b,
        estoque: dados.estoque[b.id] ?? 0,
        chance: b.id in dados.chances ? dados.chances[b.id] : b.chance ?? 0,
      }));
    },
    totalEmEstoque() {
      return this.lista().reduce((s, b) => s + Math.max(0, b.estoque), 0);
    },
    /**
     * Sorteia um brinde.
     * modo "sorte": cada brinde tem chance em %. Brinde esgotado sai do
     *   sorteio e a chance dele NÃO passa para os outros (vira "não foi desta vez").
     * modo "desempenho": quem venceu sempre ganha; a chance vira peso entre
     *   os brindes que ainda têm estoque.
     * Devolve o brinde ou null. Nunca devolve brinde com estoque zero.
     */
    sortear(modo) {
      const disp = this.lista().filter((b) => b.estoque > 0);
      if (!disp.length) return null;
      if (modo === 'sorte') {
        const r = Math.random() * 100;
        let acc = 0;
        for (const b of disp) {
          acc += Math.max(0, b.chance);
          if (r < acc) return b;
        }
        return null;
      }
      const pesos = disp.map((b) => Math.max(0, b.chance) || 1);
      const total = pesos.reduce((a, b) => a + b, 0);
      let r = Math.random() * total;
      for (let i = 0; i < disp.length; i++) {
        r -= pesos[i];
        if (r < 0) return disp[i];
      }
      return disp[disp.length - 1];
    },
    /**
     * Decide o brinde de um jogo de sorte (roleta, raspadinha) ANTES da
     * animação, e já baixa o estoque. A animação só revela o que foi decidido,
     * então a roda nunca para num brinde esgotado.
     * Devolve { brinde, esgotou }.
     */
    decidir() {
      if (this.totalEmEstoque() === 0) return { brinde: null, esgotou: true };
      const b = this.sortear('sorte');
      if (b && this.baixar(b.id)) return { brinde: b, esgotou: false };
      return { brinde: null, esgotou: false };
    },
    baixar(id) {
      if ((dados.estoque[id] ?? 0) <= 0) return false;
      dados.estoque[id] -= 1;
      J.salvar();
      return true;
    },
  };

  /* ---------- leads e ranking ---------- */
  J.leads = {
    // Grava ou atualiza pelo id: o cadastro grava na hora (quem desiste no
    // meio do jogo continua sendo lead) e o resultado completa o mesmo registro.
    registrar(lead) {
      const i = dados.leads.findIndex((l) => l.id === lead.id);
      if (i >= 0) dados.leads[i] = { ...dados.leads[i], ...lead };
      else dados.leads.push(lead);
      J.salvar();
    },
    doEscopo() {
      const escopo = (cfg.ranking && cfg.ranking.escopo) || 'dia';
      const hoje = u.hoje();
      return dados.leads.filter((l) => l.pontos != null && (escopo === 'evento' || l.dia === hoje));
    },
    ranking(n) {
      return this.doEscopo()
        .slice()
        .sort((a, b) => b.pontos - a.pontos || a.tempoMs - b.tempoMs)
        .slice(0, n || 10);
    },
    posicao(id) {
      const ord = this.doEscopo().slice().sort((a, b) => b.pontos - a.pontos || a.tempoMs - b.tempoMs);
      return ord.findIndex((l) => l.id === id) + 1;
    },
  };
})();
</script>
<script>/* nucleo/efeitos.js */
/* ============================================================
   EFEITOS — som sintetizado (sem arquivo de áudio) e confete.
   ============================================================ */
(function () {
  const J = window.J;

  /* ---------- som ---------- */
  let ctx = null;
  function audio() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function nota(freq, ini, dur, tipo, vol) {
    const a = audio();
    if (!a) return;
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = tipo || 'sine';
    o.frequency.value = freq;
    const t = a.currentTime + ini;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  const ligado = () => J.cfg.som !== false && J.ajuste('som', true);
  J.som = {
    destravar: () => audio(),
    toque: () => ligado() && nota(660, 0, 0.07, 'triangle', 0.1),
    acerto: () => { if (!ligado()) return; nota(660, 0, 0.12, 'triangle'); nota(990, 0.1, 0.22, 'triangle'); },
    erro: () => { if (!ligado()) return; nota(220, 0, 0.18, 'sawtooth', 0.08); nota(165, 0.14, 0.28, 'sawtooth', 0.08); },
    tique: () => ligado() && nota(1200, 0, 0.04, 'square', 0.04),
    vitoria: () => { if (!ligado()) return; [523, 659, 784, 1047].forEach((f, i) => nota(f, i * 0.12, 0.3, 'triangle')); },
  };

  /* ---------- confete ---------- */
  J.confete = function (ms) {
    const palco = document.getElementById('palco');
    let cv = document.getElementById('confete');
    if (!cv) {
      cv = document.createElement('canvas');
      cv.id = 'confete';
      palco.appendChild(cv);
    }
    const W = (cv.width = palco.offsetWidth);
    const H = (cv.height = palco.offsetHeight);
    const c = cv.getContext('2d');
    const cores = [J.cfg.marca.cores.primaria, J.cfg.marca.cores.destaque || '#fff', '#ffffff', J.cfg.marca.cores.acerto || '#2e9e5b'];
    const pecas = Array.from({ length: 160 }, () => ({
      x: Math.random() * W, y: -Math.random() * H * 0.5, w: 14 + Math.random() * 16, h: 8 + Math.random() * 10,
      vy: 6 + Math.random() * 9, vx: -3 + Math.random() * 6, r: Math.random() * 6, vr: -0.2 + Math.random() * 0.4,
      cor: cores[Math.floor(Math.random() * cores.length)],
    }));
    const fim = performance.now() + (ms || 2600);
    (function quadro(t) {
      c.clearRect(0, 0, W, H);
      pecas.forEach((p) => {
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.cor;
        c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); c.restore();
      });
      if (t < fim) requestAnimationFrame(quadro);
      else c.clearRect(0, 0, W, H);
    })(performance.now());
  };
})();
</script>
<script>/* nucleo/teclado.js */
/* ============================================================
   TECLADO PRÓPRIO — o teclado do Android cobre metade do totem e
   às vezes nem abre em modo quiosque. Com `cadastro.tecladoProprio`
   ligado, os campos ficam readonly e este teclado escreve neles.
   ============================================================ */
(function () {
  const J = window.J;
  const { $ } = J.u;

  const LAYOUTS = {
    texto: [
      ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'],
      ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', 'ç'],
      ['z', 'x', 'c', 'v', 'b', 'n', 'm', '⌫'],
      ['espaço', 'OK'],
    ],
    email: [
      ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'],
      ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'],
      ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', '⌫'],
      ['z', 'x', 'c', 'v', 'b', 'n', 'm', '.', '_', '-'],
      ['@', '.com', '.com.br', 'OK'],
    ],
    instagram: [
      ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'],
      ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'],
      ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', '⌫'],
      ['z', 'x', 'c', 'v', 'b', 'n', 'm', '.', '_', 'OK'],
    ],
    numero: [['1', '2', '3'], ['4', '5', '6'], ['7', '8', '9'], ['⌫', '0', 'OK']],
  };
  const layoutDo = (tipo) => (['telefone', 'numero', 'cpf', 'cnpj'].includes(tipo) ? 'numero' : LAYOUTS[tipo] ? tipo : 'texto');

  let alvo = null;
  let aoOk = null;
  const el = document.createElement('div');
  el.className = 'teclado';

  function desenhar(tipo) {
    const nome = layoutDo(tipo);
    el.classList.toggle('numerico', nome === 'numero');
    el.innerHTML = LAYOUTS[nome]
      .map(
        (linha) =>
          '<div class="linha">' +
          linha
            .map((k) => {
              const cls = k === 'espaço' ? 'w4' : k === 'OK' ? 'ok' : k.length > 1 || k === '⌫' ? 'w2' : '';
              return `<button type="button" class="${cls}" data-k="${J.u.esc(k)}">${J.u.esc(k)}</button>`;
            })
            .join('') +
          '</div>'
      )
      .join('');
  }

  el.addEventListener('pointerdown', (ev) => {
    const b = ev.target.closest('button');
    if (!b || !alvo) return;
    ev.preventDefault();
    J.som.toque();
    const k = b.dataset.k;
    if (k === 'OK') return aoOk && aoOk(alvo);
    let v = alvo.value;
    if (k === '⌫') v = v.slice(0, -1);
    else if (k === 'espaço') v += ' ';
    else v += k;
    alvo.value = v;
    alvo.dispatchEvent(new Event('input', { bubbles: true }));
  });

  J.teclado = {
    montar(palco) { palco.appendChild(el); },
    abrir(input, tipo, ok) {
      alvo = input;
      aoOk = ok;
      desenhar(tipo);
      el.classList.add('on');
      input.closest('.tela').classList.add('com-teclado');
      setTimeout(() => input.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 260);
    },
    fechar() {
      el.classList.remove('on');
      if (alvo) alvo.closest('.tela').classList.remove('com-teclado');
      alvo = null;
    },
  };
})();
</script>
<script>/* nucleo/telas.js */
/* ============================================================
   TELAS — o fluxo de um jogador:
   espera → cadastro → leitura → jogo(s) → resultado → espera.
   Cada bloco liga ou desliga pelo config do cliente.
   ============================================================ */
(function () {
  const J = window.J;
  const cfg = J.cfg;
  const { $, $$, esc } = J.u;
  const T = (J.telas = {});

  /* ---------- navegação ---------- */
  let atual = null;
  J.ir = function (nome, ...args) {
    J.teclado.fechar();
    $$('.tela').forEach((t) => t.classList.toggle('on', t.id === nome));
    atual = nome;
    J.inatividade.zerar();
    if (T[nome] && T[nome].entrar) T[nome].entrar(...args);
  };
  J.telaAtual = () => atual;

  const logoHtml = (cls) => (cfg.marca.logo ? `<img class="${cls || 'logo'}" src="${cfg.marca.logo}" alt="${esc(cfg.cliente.nome)}">` : '');
  J.logoHtml = logoHtml;

  /* ---------- sessão do jogador ---------- */
  J.novaSessao = () => {
    J.sessao = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), inicio: Date.now(), campos: {}, consentimentos: {}, jogos: [], etapaJogo: 0 };
  };

  /* ================= ESPERA ================= */
  T.espera = {
    montar() {
      const e = cfg.espera || {};
      const video = cfg.marca.videoEspera ? `<video class="video-fundo" src="${cfg.marca.videoEspera}" autoplay muted loop playsinline></video><div class="veu"></div>` : '';
      $('#espera').innerHTML = `
        ${video}
        ${logoHtml('logo-grande')}
        <div class="miolo">
          ${e.kicker ? `<p class="kicker">${esc(e.kicker)}</p>` : ''}
          <h1>${esc(e.titulo || '')}</h1>
          ${e.subtitulo ? `<p class="lede">${esc(e.subtitulo)}</p>` : ''}
        </div>
        <div class="faixa-ranking"></div>
        <div>
          <button class="btn chamada">${esc(e.chamada || 'Toque para jogar')}</button>
          ${e.dica ? `<p class="dica">${esc(e.dica)}</p>` : ''}
        </div>`;
      $('#espera').addEventListener('pointerup', (ev) => {
        if (ev.target.closest('#canto-admin')) return;
        J.som.destravar();
        J.som.toque();
        J.novaSessao();
        J.avancar('espera');
      });
    },
    entrar() {
      const f = $('#espera .faixa-ranking');
      const r = cfg.ranking || {};
      if (r.ligado && r.mostrarNaEspera) {
        const top = J.leads.ranking(3);
        f.innerHTML = top.length
          ? `<p class="kicker">Ranking de hoje</p><ol class="ranking">${top.map((l, i) => `<li><span class="pos">${i + 1}º</span><span class="nome">${esc(J.u.nomePublico(l.campos.nome))}</span><span class="pts">${l.pontos} pts</span></li>`).join('')}</ol>`
          : '';
      } else f.innerHTML = '';
      const v = $('#espera video');
      if (v) { v.currentTime = 0; v.play().catch(() => {}); }
    },
  };

  /* ================= CADASTRO ================= */
  const MASCARA = {
    telefone(v) {
      const d = v.replace(/\D/g, '').slice(0, 11);
      if (d.length <= 2) return d.length ? '(' + d : '';
      if (d.length <= 6) return `(${d.slice(0, 2)}) ${d.slice(2)}`;
      if (d.length <= 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
      return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
    },
    cpf(v) {
      const d = v.replace(/\D/g, '').slice(0, 11);
      return d.replace(/^(\d{3})(\d)/, '$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d{1,2})$/, '.$1-$2');
    },
    cnpj(v) {
      const d = v.replace(/\D/g, '').slice(0, 14);
      return d.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d{1,2})$/, '$1-$2');
    },
    instagram(v) { const s = v.replace(/[^a-zA-Z0-9._]/g, '').slice(0, 30); return s ? '@' + s : ''; },
    email(v) { return v.replace(/\s/g, '').toLowerCase(); },
    texto(v) { return v.replace(/(^|\s)(\S)/g, (m, a, b) => a + b.toUpperCase()).replace(/\s{2,}/g, ' '); },
  };
  const VALIDA = {
    texto: (v) => v.trim().length >= 2 || 'Preencha este campo',
    email: (v) => /^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(v) || 'E-mail incompleto',
    telefone: (v) => [10, 11].includes(v.replace(/\D/g, '').length) || 'Número com DDD, só números',
    instagram: (v) => v.replace('@', '').length >= 2 || 'Seu @ do Instagram',
    // CPF e CNPJ conferem os dígitos verificadores: número digitado errado não vira lead.
    cpf: (v) => {
      const d = v.replace(/\D/g, '');
      if (d.length !== 11 || /^(\d)\1+$/.test(d)) return 'CPF incompleto';
      const dv = (n) => { let s = 0; for (let i = 0; i < n; i++) s += +d[i] * (n + 1 - i); const r = (s * 10) % 11; return r === 10 ? 0 : r; };
      return (dv(9) === +d[9] && dv(10) === +d[10]) || 'CPF inválido — confira os números';
    },
    cnpj: (v) => {
      const d = v.replace(/\D/g, '');
      if (d.length !== 14 || /^(\d)\1+$/.test(d)) return 'CNPJ incompleto';
      const dv = (n) => { const pesos = n === 12 ? [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2] : [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]; let s = 0; for (let i = 0; i < n; i++) s += +d[i] * pesos[i]; const r = s % 11; return r < 2 ? 0 : 11 - r; };
      return (dv(12) === +d[12] && dv(13) === +d[13]) || 'CNPJ inválido — confira os números';
    },
  };

  T.cadastro = {
    montar() {
      const c = cfg.cadastro;
      const ro = c.tecladoProprio ? 'readonly inputmode="none"' : '';
      const tipoInput = { email: 'email', telefone: 'tel' };
      const cons = c.consentimento || {};
      $('#cadastro').innerHTML = `
        <div class="topo"><button class="voltar" data-voltar>‹ VOLTAR</button>${logoHtml()}</div>
        <p class="kicker" style="margin-top:40px">${esc(c.kicker || 'Seus dados')}</p>
        <h2>${esc(c.titulo || 'Antes de jogar')}</h2>
        ${c.texto ? `<p class="lede">${esc(c.texto)}</p>` : ''}
        <div class="form">
          ${c.campos
            .map(
              (f) => `<div class="campo" data-id="${f.id}" data-tipo="${f.tipo}" data-obrig="${f.obrigatorio ? 1 : 0}">
                <label>${esc(f.rotulo)}${f.obrigatorio ? '' : ' <span style="opacity:.6">(opcional)</span>'}</label>
                <input ${ro} type="${tipoInput[f.tipo] || 'text'}" autocomplete="off" placeholder="${esc(f.exemplo || '')}">
                <div class="msg"></div></div>`
            )
            .join('')}
          ${cons.participacao ? `<div class="consent" data-cons="participacao" data-obrig="1"><span class="caixa"></span><span>${esc(cons.participacao)}${cons.politicaUrl ? `<small>Política de privacidade: ${esc(cons.politicaUrl)}</small>` : ''}</span></div>` : ''}
          ${cons.novidades ? `<div class="consent" data-cons="novidades" data-obrig="0"><span class="caixa"></span><span>${esc(cons.novidades)}</span></div>` : ''}
        </div>
        <div class="acoes"><button class="btn largo" data-seguir>${esc(c.botao || 'Continuar')}</button></div>`;

      const tela = $('#cadastro');
      tela.querySelector('[data-voltar]').onclick = () => J.ir('espera');
      $$('.campo', tela).forEach((campo) => {
        const inp = campo.querySelector('input');
        const tipo = campo.dataset.tipo;
        inp.addEventListener('input', () => {
          const m = MASCARA[tipo] || MASCARA.texto;
          const v = m(inp.value);
          if (v !== inp.value) inp.value = v;
          inp.classList.remove('erro');
          campo.querySelector('.msg').textContent = '';
          atualizarBotao();
        });
        const focar = () => {
          $$('input', tela).forEach((i) => i.classList.remove('foco'));
          inp.classList.add('foco');
          if (c.tecladoProprio) J.teclado.abrir(inp, tipo, proximoCampo);
        };
        inp.addEventListener('pointerdown', focar);
        inp.addEventListener('focus', () => !c.tecladoProprio && inp.classList.add('foco'));
        inp.addEventListener('blur', () => !c.tecladoProprio && inp.classList.remove('foco'));
      });
      $$('.consent', tela).forEach((cx) =>
        cx.addEventListener('pointerup', () => {
          J.som.toque();
          J.teclado.fechar();
          $$('input', tela).forEach((i) => i.classList.remove('foco'));
          cx.classList.toggle('marcado');
          cx.querySelector('.caixa').textContent = cx.classList.contains('marcado') ? '✓' : '';
          atualizarBotao();
        })
      );
      tela.querySelector('[data-seguir]').onclick = enviar;

      function proximoCampo(inp) {
        const inputs = $$('.campo input', tela);
        const i = inputs.indexOf(inp);
        if (i < inputs.length - 1) inputs[i + 1].dispatchEvent(new Event('pointerdown'));
        else { J.teclado.fechar(); inp.classList.remove('foco'); }
      }
      function validar(mostrar) {
        let ok = true;
        $$('.campo', tela).forEach((campo) => {
          const v = campo.querySelector('input').value;
          if (!v && campo.dataset.obrig === '0') return;
          const r = (VALIDA[campo.dataset.tipo] || VALIDA.texto)(v);
          if (r !== true) {
            ok = false;
            if (mostrar) { campo.querySelector('input').classList.add('erro'); campo.querySelector('.msg').textContent = r; }
          }
        });
        $$('.consent[data-obrig="1"]', tela).forEach((cx) => { if (!cx.classList.contains('marcado')) ok = false; });
        return ok;
      }
      function atualizarBotao() { tela.querySelector('[data-seguir]').classList.toggle('pronto', validar(false)); }
      function enviar() {
        if (!validar(true)) {
          J.som.erro();
          const cx = $('.consent[data-obrig="1"]:not(.marcado)', tela);
          if (cx) cx.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-14px)' }, { transform: 'translateX(14px)' }, { transform: 'translateX(0)' }], { duration: 300 });
          return;
        }
        $$('.campo', tela).forEach((campo) => (J.sessao.campos[campo.dataset.id] = campo.querySelector('input').value.trim()));
        $$('.consent', tela).forEach((cx) => (J.sessao.consentimentos[cx.dataset.cons] = cx.classList.contains('marcado')));
        J.leads.registrar({ id: J.sessao.id, dia: J.u.hoje(), criadoEm: new Date().toISOString(), campos: J.sessao.campos, consentimentos: J.sessao.consentimentos, status: 'cadastrou' });
        J.som.toque();
        J.avancar('cadastro');
      }
    },
    entrar() {
      const tela = $('#cadastro');
      $$('input', tela).forEach((i) => { i.value = ''; i.classList.remove('erro', 'foco'); });
      $$('.msg', tela).forEach((m) => (m.textContent = ''));
      $$('.consent', tela).forEach((cx) => { cx.classList.remove('marcado'); cx.querySelector('.caixa').textContent = ''; });
      const primeiro = $('.campo input', tela);
      if (primeiro && cfg.cadastro.tecladoProprio) setTimeout(() => primeiro.dispatchEvent(new Event('pointerdown')), 350);
    },
  };

  /* ================= LEITURA ================= */
  T.leitura = {
    montar() {
      const l = cfg.leitura;
      $('#leitura').innerHTML = `
        <div class="topo"><button class="voltar" data-voltar>‹ VOLTAR</button>${logoHtml()}</div>
        <p class="kicker" style="margin-top:40px">${esc(l.kicker || 'Antes de jogar')}</p>
        <h2>${esc(l.titulo)}</h2>
        ${l.texto ? `<p class="lede">${esc(l.texto)}</p>` : ''}
        <div class="corpo">${l.blocos.map((b) => `<div class="bloco">${b.titulo ? `<h3>${esc(b.titulo)}</h3>` : ''}<p>${esc(b.texto)}</p></div>`).join('')}</div>
        <div class="acoes"><button class="btn sec" data-pular>Pular</button><button class="btn" data-seguir>${esc(l.botao || 'Vamos jogar')}</button></div>`;
      $('#leitura [data-voltar]').onclick = () => J.ir(cfg.cadastro && cfg.cadastro.ligado ? 'cadastro' : 'espera');
      $('#leitura [data-pular]').onclick = () => { J.sessao.pulouLeitura = true; J.avancar('leitura'); };
      $('#leitura [data-seguir]').onclick = () => { J.sessao.pulouLeitura = false; J.avancar('leitura'); };
    },
    entrar() { $('#leitura .corpo').scrollTop = 0; },
  };

  /* ================= JOGO ================= */
  T.jogo = {
    entrar() {
      const i = J.sessao.etapaJogo;
      const def = cfg.jogos[i];
      const area = $('#jogo');
      area.innerHTML = `<div class="topo">${logoHtml()}<span class="kicker" style="margin:0">${cfg.jogos.length > 1 ? `Etapa ${i + 1} de ${cfg.jogos.length}` : ''}</span></div><div class="area"></div>`;
      J.jogos[def.tipo].iniciar($('.area', area), def, (res) => {
        J.sessao.jogos.push({ tipo: def.tipo, ...res });
        J.sessao.etapaJogo++;
        J.avancar('jogo');
      });
    },
  };

  /* ================= RESULTADO ================= */
  let relogioVolta = null;
  T.resultado = {
    entrar() {
      clearInterval(relogioVolta);
      const s = J.sessao;
      const r = cfg.resultado || {};
      const soma = (k) => s.jogos.reduce((a, j) => a + (j[k] || 0), 0);
      const venceu = s.jogos.every((j) => j.venceu);
      const lead = {
        id: s.id, dia: J.u.hoje(), criadoEm: new Date().toISOString(),
        campos: s.campos, consentimentos: s.consentimentos, pulouLeitura: !!s.pulouLeitura,
        jogos: s.jogos.map(({ brinde, ...j }) => (brinde ? { ...j, brindeId: brinde.id } : j)), acertos: soma('acertos'), total: soma('total'), pontos: soma('pontos'),
        tempoMs: Date.now() - s.inicio, venceu, status: 'concluiu', brinde: null, brindeId: null, codigo: null,
      };

      // Brinde
      let brinde = null;
      let esgotou = false;
      const modo = r.modo || 'sem-brinde';
      // Um jogo de sorte (roleta, raspadinha) já decidiu o brinde na tela dele.
      const sorteador = s.jogos.find((j) => j.sorteou);
      let concorre = modo === 'sorte' ? (!r.sorteSoParaQuemVence || venceu) : modo === 'desempenho' ? venceu : false;
      if (sorteador) {
        concorre = sorteador.sorteou !== 'pulou';
        brinde = sorteador.brinde || null;
        esgotou = !!sorteador.esgotou;
      } else if (concorre) {
        if (J.brindes.totalEmEstoque() === 0) esgotou = true;
        else {
          brinde = J.brindes.sortear(modo);
          if (brinde && !J.brindes.baixar(brinde.id)) brinde = null;
        }
      }
      if (brinde) { lead.brinde = brinde.nome; lead.brindeId = brinde.id; lead.codigo = J.u.codigo(); }
      J.leads.registrar(lead);

      const ganhouAlgo = !!brinde || (modo === 'sem-brinde' && venceu);
      // Sem brinde num jogo de sorte não é derrota de quem jogou: é sorte.
      const semSorte = !!sorteador && sorteador.sorteou !== 'pulou' && !brinde;
      const titulo = brinde ? r.tituloBrinde || 'Você ganhou!' : semSorte ? r.tituloSemSorte || 'Não foi desta vez' : venceu ? r.tituloVitoria || 'Mandou bem!' : r.tituloDerrota || 'Quase lá!';
      let texto = venceu ? r.textoVitoria : r.textoDerrota;
      if (concorre && !brinde) texto = esgotou ? r.textoEsgotado || 'Os brindes deste período acabaram. Obrigado por jogar!' : r.textoSemSorte || 'Não foi desta vez — obrigado por jogar!';
      const pos = cfg.ranking && cfg.ranking.ligado ? J.leads.posicao(lead.id) : 0;
      const segundos = r.voltarAposSegundos || 25;

      $('#resultado').innerHTML = `
        <div class="selo">${ganhouAlgo || venceu ? (r.emojiVitoria || '🏆') : semSorte ? (r.emojiSemSorte || '🍀') : (r.emojiDerrota || '💪')}</div>
        <h1>${esc(titulo)}</h1>
        ${lead.total ? `<div class="placar">${lead.acertos} de ${lead.total} acertos${cfg.ranking && cfg.ranking.ligado ? ` · ${lead.pontos} pts` : ''}</div>` : ''}
        ${texto ? `<p class="lede" style="margin-left:auto;margin-right:auto">${esc(texto)}</p>` : ''}
        ${brinde ? `<div class="brinde">${brinde.imagem ? `<img class="foto" src="${brinde.imagem}" alt="">` : ''}<div class="kicker">Seu brinde</div><div class="nome">${esc(brinde.nome)}</div><div class="codigo">${lead.codigo}</div><div class="instr">${esc(r.instrucaoRetirada || 'Mostre este código no balcão para retirar.')}</div></div>` : ''}
        ${pos ? `<p class="posicao">Você está em <b>${pos}º</b> no ranking de hoje</p>` : ''}
        <div class="acoes"><button class="btn largo" data-fim>${esc(r.botaoFim || 'Concluir')}</button></div>
        <p class="contagem"></p>`;
      $('#resultado [data-fim]').onclick = () => J.ir('espera');
      if (ganhouAlgo || venceu) { J.som.vitoria(); J.confete(); } else J.som.erro();

      let resta = segundos;
      const cont = $('#resultado .contagem');
      const tic = () => { cont.textContent = `Voltando ao início em ${resta}s`; if (resta-- <= 0) { clearInterval(relogioVolta); J.ir('espera'); } };
      tic();
      relogioVolta = setInterval(() => { if (J.telaAtual() !== 'resultado') return clearInterval(relogioVolta); tic(); }, 1000);
    },
  };

  /* ---------- ordem do fluxo ---------- */
  J.avancar = function (de) {
    const temCad = cfg.cadastro && cfg.cadastro.ligado;
    const temLei = cfg.leitura && cfg.leitura.ligada;
    if (de === 'espera') return J.ir(temCad ? 'cadastro' : temLei ? 'leitura' : 'jogo');
    if (de === 'cadastro') return J.ir(temLei ? 'leitura' : 'jogo');
    if (de === 'leitura') return J.ir('jogo');
    if (de === 'jogo') return J.ir(J.sessao.etapaJogo < cfg.jogos.length ? 'jogo' : 'resultado');
  };

  /* ================= INATIVIDADE ================= */
  let tInativo = null;
  let tContagem = null;
  J.inatividade = {
    zerar() {
      clearTimeout(tInativo);
      clearInterval(tContagem);
      const aviso = $('#inativo');
      if (aviso) aviso.classList.remove('on');
      if (!atual || atual === 'espera' || atual === 'resultado') return;
      const seg = (cfg.espera && cfg.espera.inatividadeSegundos) || 45;
      tInativo = setTimeout(avisar, seg * 1000);
    },
  };
  function avisar() {
    const aviso = $('#inativo');
    let n = 10;
    aviso.querySelector('.n').textContent = n;
    aviso.classList.add('on');
    tContagem = setInterval(() => {
      n--;
      aviso.querySelector('.n').textContent = n;
      if (n <= 0) {
        clearInterval(tContagem);
        aviso.classList.remove('on');
        if (J.pararJogo) J.pararJogo();
        J.ir('espera');
      }
    }, 1000);
  }
})();
</script>
<script>/* nucleo/admin.js */
/* ============================================================
   ADMIN — painel do operador do estande.
   Abre com N toques rápidos no canto secreto + PIN.
   Estoque e chance dos brindes, tempo do quiz, som, sorteio,
   exportar leads em CSV e zerar o aparelho no fim do evento.
   Visual neutro de propósito: não é tela do cliente.
   ============================================================ */
(function () {
  const J = window.J;
  const cfg = J.cfg;
  const { esc } = J.u;
  const A = cfg.admin || {};

  const css = `
  #admin { position:absolute; inset:0; z-index:80; background:#101114; color:#ECEDEF; font:28px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; display:none; flex-direction:column; }
  #admin.on { display:flex; }
  #admin header { display:flex; align-items:center; gap:20px; padding:36px 48px; border-bottom:2px solid #24262B; }
  #admin header b { font-size:34px; } #admin header span { color:#8B8F98; font-size:24px; }
  #admin header button { margin-left:auto; }
  #admin nav { display:flex; gap:8px; padding:20px 40px 0; flex-wrap:wrap; }
  #admin nav button { background:none; border:0; color:#8B8F98; font:600 28px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:20px 26px; border-radius:16px 16px 0 0; }
  #admin nav button.on { background:#1B1D22; color:#fff; }
  #admin main { flex:1; overflow-y:auto; background:#1B1D22; margin:0 40px 40px; border-radius:0 20px 20px 20px; padding:40px; }
  #admin .ab { background:#2C6BED; color:#fff; border:0; border-radius:16px; min-height:88px; padding:0 34px; font:700 28px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #admin .ab.sec { background:#2A2D33; } #admin .ab.perigo { background:#B42318; } #admin .ab.peq { min-height:72px; min-width:72px; padding:0 20px; font-size:36px; }
  #admin .grade { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px; }
  #admin .card { background:#24262B; border-radius:18px; padding:28px; }
  #admin .card .v { font-size:64px; font-weight:800; } #admin .card .r { color:#8B8F98; font-size:24px; }
  #admin table { width:100%; border-collapse:collapse; } #admin td,#admin th { padding:18px 12px; border-bottom:1px solid #2A2D33; text-align:left; }
  #admin th { color:#8B8F98; font-size:22px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; }
  #admin .aviso { background:#3A2A10; color:#FFD58A; border-radius:16px; padding:22px 26px; margin-bottom:24px; }
  #admin .perigo-txt { color:#FF8A80; }
  #admin .linha { display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin:18px 0; }
  #admin input.num { width:130px; height:72px; background:#101114; color:#fff; border:2px solid #34373E; border-radius:12px; font:700 32px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; text-align:center; }
  #admin h3 { margin:0 0 20px; font-size:32px; }
  #admin .pin { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; gap:36px; }
  #admin .pin .dots { display:flex; gap:24px; } #admin .pin .dots i { width:34px; height:34px; border-radius:50%; border:3px solid #8B8F98; }
  #admin .pin .dots i.on { background:#fff; border-color:#fff; }
  #admin .pin .pad { display:grid; grid-template-columns:repeat(3,150px); gap:20px; }
  #admin .pin .pad button { height:130px; border-radius:24px; border:0; background:#24262B; color:#fff; font:600 52px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #admin .sorteado { font-size:72px; font-weight:800; margin:24px 0 8px; }`;
  const st = document.createElement('style');
  st.textContent = css;
  document.head.appendChild(st);

  let el, aba = 'resumo', pin = '';

  /* ---------- gatilho secreto ---------- */
  function montarCanto(palco) {
    const c = document.createElement('div');
    c.id = 'canto-admin';
    const canto = A.canto || 'inferior-esquerdo';
    c.style[canto.includes('inferior') ? 'bottom' : 'top'] = '0';
    c.style[canto.includes('esquerdo') ? 'left' : 'right'] = '0';
    palco.appendChild(c);
    let toques = [];
    c.addEventListener('pointerup', (ev) => {
      ev.stopPropagation();
      const agora = Date.now();
      toques = toques.filter((t) => agora - t < 3000).concat(agora);
      if (toques.length >= (A.toques || 5)) { toques = []; abrir(); }
    });
  }

  function abrir() {
    if (J.pararJogo) J.pararJogo();
    pin = '';
    el.classList.add('on');
    telaPin();
  }
  function fechar() {
    el.classList.remove('on');
    J.ir('espera');
  }

  /* ---------- PIN ---------- */
  function telaPin(erro) {
    el.innerHTML = `<header><b>Operador</b><span>${esc(cfg.cliente.nome)}</span><button class="ab sec" data-sair>Voltar ao jogo</button></header>
      <div class="pin"><div>${erro ? '<span class="perigo-txt">PIN incorreto</span>' : 'Digite o PIN'}</div>
      <div class="dots">${[0, 1, 2, 3].map((i) => `<i class="${i < pin.length ? 'on' : ''}"></i>`).join('')}</div>
      <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map((k) => `<button data-k="${k}" ${k === '' ? 'style="visibility:hidden"' : ''}>${k}</button>`).join('')}</div></div>`;
    el.querySelector('[data-sair]').onclick = fechar;
    el.querySelectorAll('.pad button').forEach((b) =>
      (b.onclick = () => {
        const k = b.dataset.k;
        pin = k === '⌫' ? pin.slice(0, -1) : (pin + k).slice(0, 4);
        if (pin.length === 4) {
          if (J.u.hashPin(A.sal, pin) === A.pinHash) { pin = ''; aba = 'resumo'; painel(); }
          else { pin = ''; telaPin(true); }
        } else telaPin();
      })
    );
  }

  /* ---------- painel ---------- */
  const ABAS = { resumo: 'Resumo', brindes: 'Brindes', leads: 'Leads', ajustes: 'Ajustes', sorteio: 'Sorteio' };
  function painel() {
    const abas = Object.keys(ABAS).filter((k) => (k !== 'brindes' || (cfg.brindes || []).length) && (k !== 'sorteio' || (cfg.sorteio && cfg.sorteio.ligado)));
    el.innerHTML = `<header><b>Operador</b><span>${esc(cfg.cliente.nome)} · ${new Date().toLocaleDateString('pt-BR')}</span><button class="ab" data-sair>Voltar ao jogo</button></header>
      <nav>${abas.map((k) => `<button data-aba="${k}" class="${k === aba ? 'on' : ''}">${ABAS[k]}</button>`).join('')}</nav><main></main>`;
    el.querySelector('[data-sair]').onclick = fechar;
    el.querySelectorAll('nav button').forEach((b) => (b.onclick = () => { aba = b.dataset.aba; painel(); }));
    const m = el.querySelector('main');
    ({ resumo, brindes, leads, ajustes, sorteio })[aba](m);
  }

  function resumo(m) {
    const hoje = J.u.hoje();
    const L = J.dados.leads;
    const dia = L.filter((l) => l.dia === hoje);
    const conc = dia.filter((l) => l.status === 'concluiu');
    const entregues = dia.filter((l) => l.codigo).length;
    m.innerHTML = `${J.falhaGravacao ? '<div class="aviso">⚠ O aparelho não conseguiu gravar o último registro (memória cheia ou bloqueada). Exporte os leads agora.</div>' : ''}
      ${J.brindes.totalEmEstoque() === 0 && (cfg.brindes || []).length ? '<div class="aviso">⚠ Todos os brindes estão zerados. Quem jogar agora não ganha nada. Ajuste em Brindes.</div>' : ''}
      <div class="grade">
        <div class="card"><div class="v">${dia.length}</div><div class="r">cadastros hoje</div></div>
        <div class="card"><div class="v">${conc.length}</div><div class="r">jogaram até o fim hoje</div></div>
        <div class="card"><div class="v">${entregues}</div><div class="r">brindes ganhos hoje</div></div>
        <div class="card"><div class="v">${L.length}</div><div class="r">leads no aparelho (total)</div></div>
      </div>
      <p class="r" style="color:#8B8F98;margin-top:32px">Os dados ficam só neste aparelho. Exporte em <b>Leads</b> no fim de cada dia.</p>`;
  }

  function brindes(m) {
    const lista = J.brindes.lista();
    const modo = cfg.jogos.some((j) => ['roleta', 'raspadinha'].includes(j.tipo)) ? 'sorte' : (cfg.resultado || {}).modo;
    const somaChance = lista.reduce((s, b) => s + (b.estoque > 0 ? b.chance : 0), 0);
    m.innerHTML = `<h3>Estoque ${modo === 'sorte' ? 'e chance' : ''}</h3>
      ${modo === 'sorte' ? `<p style="color:#8B8F98">Chance de ganhar algo agora: <b style="color:#fff">${Math.min(100, somaChance)}%</b>. Brinde zerado sai do sorteio e a chance dele não passa para os outros.</p>` : '<p style="color:#8B8F98">Quem vence ganha um brinde; a chance funciona como peso entre os que têm estoque.</p>'}
      <table><tr><th>Brinde</th><th>Estoque</th><th>${modo === 'sorte' ? 'Chance %' : 'Peso'}</th></tr>
      ${lista.map((b) => `<tr><td>${esc(b.nome)}</td>
        <td><div class="linha" style="margin:0"><button class="ab sec peq" data-est="${b.id}" data-d="-1">−</button><input class="num" data-estv="${b.id}" value="${b.estoque}" inputmode="numeric"><button class="ab sec peq" data-est="${b.id}" data-d="1">+</button></div></td>
        <td><input class="num" data-ch="${b.id}" value="${b.chance}" inputmode="numeric"></td></tr>`).join('')}</table>`;
    m.querySelectorAll('[data-est]').forEach((b) => (b.onclick = () => { const id = b.dataset.est; J.dados.estoque[id] = Math.max(0, (J.dados.estoque[id] || 0) + +b.dataset.d); J.salvar(); brindes(m); }));
    m.querySelectorAll('[data-estv]').forEach((i) => (i.onchange = () => { J.dados.estoque[i.dataset.estv] = Math.max(0, parseInt(i.value, 10) || 0); J.salvar(); brindes(m); }));
    m.querySelectorAll('[data-ch]').forEach((i) => (i.onchange = () => { J.dados.chances[i.dataset.ch] = Math.min(100, Math.max(0, parseFloat(i.value) || 0)); J.salvar(); brindes(m); }));
  }

  /* ---------- CSV ---------- */
  function csv(lista) {
    const campos = (cfg.cadastro && cfg.cadastro.campos || []).map((c) => c.id);
    const cab = ['data_hora', ...campos, 'aceitou_participacao', 'aceitou_novidades', 'status', 'acertos', 'total', 'pontos', 'tempo_seg', 'venceu', 'brinde', 'codigo'];
    const cel = (v) => { const s = String(v == null ? '' : v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const linhas = lista.map((l) => [
      J.u.hora(l.criadoEm), ...campos.map((c) => (l.campos || {})[c]),
      (l.consentimentos || {}).participacao ? 'sim' : 'não', (l.consentimentos || {}).novidades ? 'sim' : 'não',
      l.status || '', l.acertos ?? '', l.total ?? '', l.pontos ?? '', l.tempoMs ? Math.round(l.tempoMs / 1000) : '', l.venceu == null ? '' : l.venceu ? 'sim' : 'não', l.brinde || '', l.codigo || '',
    ].map(cel).join(';'));
    return '﻿' + [cab.join(';'), ...linhas].join('\r\n');
  }
  function baixar(nome, texto) {
    // No APK, a ponte nativa grava em Downloads (o WebView não baixa blob).
    if (window.AndroidPonte && window.AndroidPonte.salvarArquivo) return window.AndroidPonte.salvarArquivo(nome, texto);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([texto], { type: 'text/csv;charset=utf-8' }));
    a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    return 'Baixado: ' + nome;
  }

  function leads(m) {
    const hoje = J.u.hoje();
    const L = J.dados.leads;
    const dia = L.filter((l) => l.dia === hoje);
    const ult = L.slice(-8).reverse();
    m.innerHTML = `<div class="linha"><button class="ab" data-x="hoje">Exportar CSV de hoje (${dia.length})</button><button class="ab sec" data-x="tudo">Exportar tudo (${L.length})</button></div>
      <p class="r" style="color:#8B8F98" data-msg></p>
      <h3 style="margin-top:36px">Últimos cadastros</h3>
      <table><tr><th>Hora</th><th>Nome</th><th>Status</th><th>Brinde</th></tr>
      ${ult.map((l) => `<tr><td>${new Date(l.criadoEm).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</td><td>${esc((l.campos || {}).nome || '—')}</td><td>${l.status === 'concluiu' ? `${l.acertos}/${l.total}` : 'desistiu'}</td><td>${esc(l.codigo ? l.brinde + ' · ' + l.codigo : '—')}</td></tr>`).join('') || '<tr><td colspan="4">Nenhum ainda.</td></tr>'}</table>
      <h3 style="margin-top:48px" class="perigo-txt">Zerar o aparelho</h3>
      <p style="color:#8B8F98">Apaga todos os leads e volta o estoque ao do início. Só no fim do evento, <b>depois de exportar</b>.</p>
      <button class="ab perigo" data-zerar>Zerar tudo…</button>`;
    const msg = m.querySelector('[data-msg]');
    m.querySelectorAll('[data-x]').forEach((b) => (b.onclick = () => {
      const lista = b.dataset.x === 'hoje' ? dia : L;
      const nome = `leads-${cfg.cliente.slug}-${b.dataset.x === 'hoje' ? hoje : 'tudo'}-${Date.now().toString(36)}.csv`;
      msg.textContent = baixar(nome, csv(lista)) || 'Exportado.';
      J.dados.ultimaExportacao = new Date().toISOString(); J.salvar();
    }));
    m.querySelector('[data-zerar]').onclick = () => {
      const exp = J.dados.ultimaExportacao ? `Última exportação: ${J.u.hora(J.dados.ultimaExportacao)}.` : 'ATENÇÃO: nenhuma exportação feita neste aparelho.';
      m.innerHTML = `<h3 class="perigo-txt">Zerar o aparelho?</h3><p>${L.length} leads serão apagados. ${exp}</p><p>Para confirmar, toque 3 vezes no botão vermelho.</p>
        <div class="linha"><button class="ab sec" data-nao>Cancelar</button><button class="ab perigo" data-sim>Apagar (3)</button></div>`;
      let n = 3;
      m.querySelector('[data-nao]').onclick = () => leads(m);
      m.querySelector('[data-sim]').onclick = (ev) => {
        if (--n > 0) return (ev.target.textContent = `Apagar (${n})`);
        J.dados.leads = []; J.dados.sorteios = []; J.dados.estoque = {}; J.dados.chances = {};
        (cfg.brindes || []).forEach((b) => (J.dados.estoque[b.id] = b.estoque));
        J.salvar(); leads(m);
      };
    };
  }

  function ajustes(m) {
    const temQuiz = cfg.jogos.some((j) => j.tipo === 'quiz');
    const q = cfg.jogos.find((j) => j.tipo === 'quiz') || {};
    const seg = J.ajuste('quiz.segundos', q.segundosPorPergunta || 20);
    const som = J.ajuste('som', true);
    // Tempo de cada jogo cronometrado, ajustável no evento.
    const TEMPOS = [['memoria', 'memoria.segundos', 'Tempo da memória', 60, 15, 300, 10], ['reflexo', 'reflexo.segundos', 'Tempo do reflexo', 30, 10, 120, 5], ['caca-palavras', 'caca.segundos', 'Tempo do caça-palavras', 120, 30, 600, 15]]
      .filter(([t]) => cfg.jogos.some((j) => j.tipo === t))
      .map(([t, k, rot, pad, min, max, passo]) => ({ k, rot, min, max, passo, v: J.ajuste(k, cfg.jogos.find((j) => j.tipo === t).segundos || pad) }));
    m.innerHTML = `${temQuiz ? `<h3>Tempo por pergunta</h3><div class="linha"><button class="ab sec peq" data-s="-5">−</button><span style="font-size:48px;font-weight:800;min-width:160px;text-align:center">${seg}s</span><button class="ab sec peq" data-s="5">+</button></div>` : ''}
      ${TEMPOS.map((t, i) => `<h3 style="margin-top:40px">${t.rot}</h3><div class="linha"><button class="ab sec peq" data-tp="${i}" data-d="-1">−</button><span style="font-size:48px;font-weight:800;min-width:160px;text-align:center">${t.v}s</span><button class="ab sec peq" data-tp="${i}" data-d="1">+</button></div>`).join('')}
      <h3 style="margin-top:40px">Som</h3><div class="linha"><button class="ab ${som ? '' : 'sec'}" data-som="1">Ligado</button><button class="ab ${som ? 'sec' : ''}" data-som="0">Desligado</button></div>
      <h3 style="margin-top:40px">Tela cheia</h3><div class="linha"><button class="ab sec" data-fs>Entrar em tela cheia</button></div>`;
    m.querySelectorAll('[data-s]').forEach((b) => (b.onclick = () => { J.dados.ajustes['quiz.segundos'] = Math.min(90, Math.max(5, seg + +b.dataset.s)); J.salvar(); ajustes(m); }));
    m.querySelectorAll('[data-tp]').forEach((b) => (b.onclick = () => { const t = TEMPOS[+b.dataset.tp]; J.dados.ajustes[t.k] = Math.min(t.max, Math.max(t.min, t.v + t.passo * +b.dataset.d)); J.salvar(); ajustes(m); }));
    m.querySelectorAll('[data-som]').forEach((b) => (b.onclick = () => { J.dados.ajustes.som = b.dataset.som === '1'; J.salvar(); ajustes(m); }));
    m.querySelector('[data-fs]').onclick = () => document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {});
  }

  function sorteio(m) {
    const s = cfg.sorteio || {};
    const hoje = J.u.hoje();
    const jaSorteados = new Set(J.dados.sorteios.map((x) => x.id));
    const aptos = J.dados.leads.filter((l) => l.dia === hoje && (s.soQuemConcluiu === false || l.status === 'concluiu') && !jaSorteados.has(l.id));
    const campo = s.campoExibido || 'nome';
    const mascarar = (v) => { const d = String(v || ''); return campo === 'nome' ? d : d.replace(/\d(?=\d{4})/g, '•'); };
    const ult = J.dados.sorteios.filter((x) => x.dia === hoje);
    m.innerHTML = `<h3>Sorteio de hoje</h3><p style="color:#8B8F98">${aptos.length} participantes aptos (quem ${s.soQuemConcluiu === false ? 'se cadastrou' : 'jogou até o fim'} hoje e ainda não foi sorteado).</p>
      <button class="ab" data-sortear ${aptos.length ? '' : 'disabled'}>Sortear agora</button><div data-res></div>
      ${ult.length ? `<h3 style="margin-top:40px">Já sorteados hoje</h3><table>${ult.map((x) => `<tr><td>${new Date(x.em).toLocaleTimeString('pt-BR')}</td><td>${esc(x.nome)}</td><td>${esc(mascarar(x.exibido))}</td></tr>`).join('')}</table>` : ''}`;
    m.querySelector('[data-sortear]').onclick = () => {
      const l = aptos[Math.floor(Math.random() * aptos.length)];
      J.dados.sorteios.push({ id: l.id, dia: hoje, em: new Date().toISOString(), nome: (l.campos || {}).nome || '', exibido: (l.campos || {})[campo] || '' });
      J.salvar();
      sorteio(m);
      m.querySelector('[data-res]').innerHTML = `<div class="sorteado">${esc(J.u.nomePublico((l.campos || {}).nome))}</div><div style="font-size:40px">${esc(mascarar((l.campos || {})[campo]))}</div>`;
    };
  }

  J.admin = {
    montar(palco) {
      el = document.createElement('div');
      el.id = 'admin';
      palco.appendChild(el);
      montarCanto(palco);
    },
  };
})();
</script>
<script>/* jogos/memoria.js */
/* ============================================================
   JOGO: MEMÓRIA
   config: { tipo:"memoria", modo:"iguais"|"associar", segundos,
             paresPorRodada, pares:[{ a:{texto?,emoji?,imagem?},
                                      b:{...} (só no modo associar) }] }
   iguais   → as duas cartas do par são a mesma (a).
   associar → uma carta é "a", a outra é "b" (termo ↔ definição):
              é o modo que ensina alguma coisa sobre o cliente.
   Vence quem acha todos os pares dentro do tempo.
   Pontos: 100 por par + 5 por segundo que sobrou − 5 por erro.
   ============================================================ */
(function () {
  const J = window.J;
  const { esc, embaralhar } = J.u;

  const css = `
  .mem-topo { display:flex; align-items:center; gap:24px; margin:28px 0 20px; font:700 30px/1 var(--fonte-texto); color:var(--texto-suave); }
  .mem-topo .pontos { margin-left:auto; color:var(--destaque); font-family:var(--fonte-titulo); font-size:40px; }
  .mem-barra { height:18px; border-radius:99px; background:var(--superficie); overflow:hidden; margin-bottom:28px; }
  .mem-barra i { display:block; height:100%; width:100%; background:var(--destaque); transform-origin:left; }
  .mem-barra.urgente i { background:var(--erro); }
  .mem-dica { font:600 32px/1.3 var(--fonte-texto); color:var(--texto-suave); margin:0 0 24px; text-align:center; }
  .mem-grade { flex:1; min-height:0; display:grid; gap:20px; perspective:2400px; }
  .mem-carta { position:relative; border:0; padding:0; background:none; transform-style:preserve-3d; transition:transform 420ms cubic-bezier(.3,1.3,.5,1); animation:mEntra 420ms ease backwards; }
  .mem-carta.virada, .mem-carta.achada { transform:rotateY(180deg); }
  .mem-face { position:absolute; inset:0; border-radius:26px; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:18px; text-align:center; overflow:hidden; }
  .mem-verso { background:var(--primaria); box-shadow:inset 0 0 0 6px var(--primaria-sombra); }
  .mem-verso img { max-width:62%; max-height:46%; object-fit:contain; opacity:.9; filter:drop-shadow(0 4px 8px rgba(0,0,0,.25)); }
  .mem-verso .marca { font:800 64px/1 var(--fonte-titulo); color:var(--texto-primaria); opacity:.85; }
  .mem-frente { background:var(--superficie); border:4px solid var(--linha); transform:rotateY(180deg); color:var(--texto); }
  .mem-frente .emoji { font-size:84px; line-height:1; }
  .mem-frente .txt { font:700 30px/1.2 var(--fonte-texto); }
  .mem-frente .txt.so { font-size:38px; }
  .mem-frente img { max-width:100%; max-height:70%; object-fit:contain; border-radius:14px; }
  .mem-frente.lado-b { background:var(--fundo); border-style:dashed; }
  .mem-carta.achada .mem-frente { border-color:var(--acerto); box-shadow:0 0 0 6px var(--acerto); }
  .mem-carta.achada { animation:mAchou 520ms ease; }
  .mem-carta.errou .mem-frente { border-color:var(--erro); }
  @keyframes mEntra { from { opacity:0; transform:scale(.6); } to { opacity:1; transform:none; } }
  @keyframes mAchou { 0%{transform:rotateY(180deg) scale(1)} 45%{transform:rotateY(180deg) scale(1.08)} 100%{transform:rotateY(180deg) scale(1)} }`;
  const st = document.createElement('style');
  st.textContent = css;
  document.head.appendChild(st);

  let timers = [];
  const limpar = () => { timers.forEach((t) => (clearTimeout(t), clearInterval(t))); timers = []; };

  function face(lado, cls) {
    if (lado.imagem) return `<div class="mem-face mem-frente ${cls}"><img src="${lado.imagem}" alt="">${lado.texto ? `<div class="txt">${esc(lado.texto)}</div>` : ''}</div>`;
    return `<div class="mem-face mem-frente ${cls}">${lado.emoji ? `<div class="emoji">${esc(lado.emoji)}</div>` : ''}${lado.texto ? `<div class="txt ${lado.emoji ? '' : 'so'}">${esc(lado.texto)}</div>` : ''}</div>`;
  }

  J.jogos.memoria = {
    iniciar(area, def, fim) {
      limpar();
      J.pararJogo = limpar;
      const associar = def.modo === 'associar';
      const seg = J.ajuste('memoria.segundos', def.segundos || 60);
      const n = Math.min(def.paresPorRodada || def.pares.length, def.pares.length);
      const pares = embaralhar(def.pares).slice(0, n);
      const cartas = embaralhar(pares.flatMap((p, i) => [{ par: i, lado: p.a, b: false }, { par: i, lado: associar ? p.b : p.a, b: associar }]));
      const paisagem = document.getElementById('palco').classList.contains('paisagem');
      const total = cartas.length;
      const cols = paisagem ? (total <= 12 ? 6 : total <= 16 ? 8 : 10) : total <= 12 ? 3 : total <= 20 ? 4 : 5;
      const linhas = Math.ceil(total / cols);
      const verso = J.cfg.marca.logo ? `<img src="${J.cfg.marca.logo}" alt="">` : `<span class="marca">?</span>`;

      area.innerHTML = `
        <div class="mem-topo"><span class="pares">0 de ${n} pares</span><span class="pontos">0 pts</span></div>
        <div class="mem-barra"><i></i></div>
        ${def.dica || associar ? `<p class="mem-dica">${esc(def.dica || 'Encontre os pares que combinam')}</p>` : ''}
        <div class="mem-grade" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${linhas},1fr)">
          ${cartas.map((c, k) => `<button class="mem-carta" data-k="${k}" style="animation-delay:${k * 35}ms"><div class="mem-face mem-verso">${verso}</div>${face(c.lado, c.b ? 'lado-b' : '')}</button>`).join('')}
        </div>`;

      const barra = area.querySelector('.mem-barra i');
      barra.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }], { duration: seg * 1000, easing: 'linear', fill: 'forwards' });
      const t0 = Date.now();
      let abertas = [], achados = 0, erros = 0, travado = false, acabou = false;
      timers.push(setTimeout(() => area.querySelector('.mem-barra').classList.add('urgente'), Math.max(0, seg - 10) * 1000));
      timers.push(setInterval(() => { if (seg * 1000 - (Date.now() - t0) < 10000) J.som.tique(); }, 1000));
      timers.push(setTimeout(() => terminar(false), seg * 1000));

      const btns = Array.from(area.querySelectorAll('.mem-carta'));
      const pontos = () => Math.max(0, achados * 100 - erros * 5);
      btns.forEach((b) =>
        b.addEventListener('pointerup', () => {
          if (travado || acabou || b.classList.contains('virada') || b.classList.contains('achada')) return;
          J.som.toque();
          b.classList.add('virada');
          abertas.push(b);
          if (abertas.length < 2) return;
          const [x, y] = abertas;
          const cx = cartas[+x.dataset.k], cy = cartas[+y.dataset.k];
          abertas = [];
          if (cx.par === cy.par) {
            [x, y].forEach((c) => { c.classList.remove('virada'); c.classList.add('achada'); });
            achados++;
            J.som.acerto();
            area.querySelector('.pares').textContent = `${achados} de ${n} pares`;
            area.querySelector('.pontos').textContent = pontos() + ' pts';
            if (achados === n) timers.push(setTimeout(() => terminar(true), 700));
          } else {
            erros++;
            travado = true;
            [x, y].forEach((c) => c.classList.add('errou'));
            timers.push(setTimeout(() => { J.som.erro(); }, 250));
            timers.push(setTimeout(() => { [x, y].forEach((c) => c.classList.remove('virada', 'errou')); travado = false; }, 950));
          }
        })
      );

      function terminar(venceu) {
        if (acabou) return;
        acabou = true;
        limpar();
        barra.getAnimations().forEach((a) => a.pause());
        const resto = Math.max(0, seg - Math.round((Date.now() - t0) / 1000));
        const pts = pontos() + (venceu ? resto * 5 : 0);
        if (!venceu) {
          // Mostra o que faltava antes de sair, para ninguém achar que foi injusto.
          btns.forEach((b) => b.classList.add('virada'));
          J.som.erro();
        }
        timers.push(setTimeout(() => fim({ acertos: achados, total: n, pontos: pts, tempoMs: Date.now() - t0, venceu }), venceu ? 200 : 1800));
      }
    },
  };
})();
</script>
<script>/* jogos/roleta.js */
/* ============================================================
   JOGO: ROLETA
   config: { tipo:"roleta", exigeVitoriaAnterior?, titulo?, fatias?:[
             { rotulo, brinde:<id do brinde>|null, emoji? } ] }
   Sem "fatias", a roda é montada dos brindes, com uma fatia
   "Tente de novo" entre cada um.
   O brinde é DECIDIDO antes do giro (J.brindes.decidir, com a
   chance e o estoque do admin); a roda só anima até a fatia certa.
   Por isso ela nunca para num brinde esgotado.
   ============================================================ */
(function () {
  const J = window.J;
  const { esc } = J.u;

  const css = `
  .rol { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:48px; text-align:center; }
  .rol h2 { max-width:900px; }
  .rol-caixa { position:relative; width:880px; height:880px; }
  .paisagem .rol { flex-direction:row; gap:80px; text-align:left; }
  .paisagem .rol-caixa { width:780px; height:780px; }
  .rol canvas { width:100%; height:100%; border-radius:50%; box-shadow:0 30px 80px rgba(0,0,0,.35), 0 0 0 16px var(--superficie); }
  .rol-seta { position:absolute; left:50%; top:-34px; transform:translateX(-50%); width:0; height:0; border-left:44px solid transparent; border-right:44px solid transparent; border-top:88px solid var(--destaque); filter:drop-shadow(0 6px 6px rgba(0,0,0,.35)); z-index:2; }
  .rol-seta.bate { animation:rBate 120ms ease; }
  .rol-centro { position:absolute; left:50%; top:50%; width:180px; height:180px; transform:translate(-50%,-50%); border-radius:50%; background:var(--fundo); box-shadow:0 0 0 12px var(--superficie); display:grid; place-items:center; overflow:hidden; }
  .rol-centro img { max-width:70%; max-height:70%; object-fit:contain; }
  .rol-lado { display:flex; flex-direction:column; gap:36px; align-items:center; max-width:760px; }
  .paisagem .rol-lado { align-items:flex-start; }
  .rol-res { font:800 72px/1.05 var(--fonte-titulo); color:var(--destaque); min-height:80px; animation:rEntra 380ms ease both; }
  @keyframes rEntra { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:none; } }
  @keyframes rBate { 0%{transform:translateX(-50%) rotate(0)} 50%{transform:translateX(-50%) rotate(-12deg)} 100%{transform:translateX(-50%) rotate(0)} }`;
  const st = document.createElement('style');
  st.textContent = css;
  document.head.appendChild(st);

  let timers = [], raf = null;
  const limpar = () => { timers.forEach((t) => clearTimeout(t)); timers = []; if (raf) cancelAnimationFrame(raf); raf = null; };

  // Fatias padrão: cada brinde, intercalado com "Tente de novo".
  J.roletaFatias = function (def) {
    if (def.fatias && def.fatias.length) return def.fatias;
    const f = [];
    (J.cfg.brindes || []).forEach((b) => { f.push({ rotulo: b.nome, brinde: b.id }); f.push({ rotulo: def.rotuloNada || 'Tente de novo', brinde: null }); });
    return f;
  };

  function lum(hex) {
    const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((v) => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }

  J.jogos.roleta = {
    iniciar(area, def, fim) {
      limpar();
      J.pararJogo = limpar;
      const anteriores = J.sessao.jogos;
      if (def.exigeVitoriaAnterior && anteriores.length && !anteriores.every((j) => j.venceu)) {
        return fim({ acertos: 0, total: 0, pontos: 0, tempoMs: 0, venceu: false, sorteou: 'pulou' });
      }
      const fatias = J.roletaFatias(def);
      const N = fatias.length;
      const cs = getComputedStyle(document.documentElement);
      const cor = (v) => cs.getPropertyValue(v).trim();
      const paleta = def.cores && def.cores.length ? def.cores : [cor('--primaria'), cor('--superficie'), cor('--destaque'), cor('--fundo')];

      area.innerHTML = `<div class="rol">
        <div class="rol-caixa"><div class="rol-seta"></div><canvas width="1000" height="1000"></canvas>
          <div class="rol-centro">${J.cfg.marca.logo ? `<img src="${J.cfg.marca.logo}" alt="">` : ''}</div></div>
        <div class="rol-lado"><h2>${esc(def.titulo || 'Gire a roleta!')}</h2><div class="rol-res"></div>
          <button class="btn largo" data-girar>${esc(def.botao || 'Girar')}</button></div></div>`;

      const cv = area.querySelector('canvas');
      const c = cv.getContext('2d');
      const R = 500;
      const passo = (Math.PI * 2) / N;
      function desenhar(ang) {
        c.clearRect(0, 0, 1000, 1000);
        c.save();
        c.translate(R, R);
        c.rotate(ang);
        for (let i = 0; i < N; i++) {
          // Fatia i começa em -90° (topo) e anda no sentido horário.
          const ini = -Math.PI / 2 + i * passo;
          const fundo = fatias[i].cor || paleta[i % paleta.length];
          c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, R, ini, ini + passo); c.closePath();
          c.fillStyle = fundo; c.fill();
          c.strokeStyle = 'rgba(0,0,0,.18)'; c.lineWidth = 4; c.stroke();
          c.save();
          c.rotate(ini + passo / 2);
          c.textAlign = 'right'; c.textBaseline = 'middle';
          c.fillStyle = /^#[0-9a-f]{6}$/i.test(fundo) && lum(fundo) > 0.45 ? '#15140E' : '#FFFFFF';
          // Cabe entre a borda e o círculo do centro; se não couber, quebra em duas linhas.
          const txt = (fatias[i].emoji ? fatias[i].emoji + ' ' : '') + fatias[i].rotulo;
          const largura = R - 36 - 150;
          const fonte = (t) => (c.font = `800 ${t}px ${cor('--fonte-titulo') || 'sans-serif'}`);
          let tam = N > 10 ? 34 : 42;
          let linhas = [txt];
          fonte(tam);
          if (c.measureText(txt).width > largura) {
            const p = txt.split(' ');
            let melhor = [txt], pior = Infinity;
            for (let k = 1; k < p.length; k++) {
              const l = [p.slice(0, k).join(' '), p.slice(k).join(' ')];
              const m = Math.max(...l.map((x) => c.measureText(x).width));
              if (m < pior) { pior = m; melhor = l; }
            }
            linhas = melhor;
          }
          while (Math.max(...linhas.map((x) => c.measureText(x).width)) > largura && tam > 18) fonte(--tam);
          const alt = tam * 1.1;
          linhas.forEach((l, k) => c.fillText(l, R - 36, (k - (linhas.length - 1) / 2) * alt));
          c.restore();
        }
        c.restore();
      }
      let angulo = 0;
      desenhar(angulo);

      const btn = area.querySelector('[data-girar]');
      let girou = false;
      const t0 = Date.now();
      const girar = () => {
        if (girou) return;
        girou = true;
        btn.disabled = true;
        J.som.toque();
        const { brinde, esgotou } = J.brindes.decidir();
        const alvoId = brinde ? brinde.id : null;
        const candidatas = fatias.map((f, i) => (f.brinde === alvoId ? i : -1)).filter((i) => i >= 0);
        // O build garante que existe fatia para cada brinde e ao menos uma "nada".
        const alvo = candidatas[Math.floor(Math.random() * candidatas.length)] ?? 0;
        // Centro da fatia alvo sob a seta (topo): ang = -(alvo + 0.5) * passo, com folga aleatória dentro da fatia.
        const folga = (Math.random() - 0.5) * passo * 0.6;
        const voltas = 6 + Math.floor(Math.random() * 3);
        const final = voltas * Math.PI * 2 - (alvo + 0.5) * passo + folga;
        const dur = (def.segundosGiro || 5.5) * 1000;
        const ini = performance.now();
        let ultimaFatia = -1;
        const seta = area.querySelector('.rol-seta');
        let terminou = false;
        // Garantia: se o navegador pausar a animação (tela escondida, aparelho
        // lento), o giro termina pelo relógio e o jogador não fica preso.
        timers.push(setTimeout(() => quadro(ini + dur), dur + 400));
        function quadro(t) {
          if (terminou) return;
          const p = Math.min(1, (t - ini) / dur);
          const e = 1 - Math.pow(1 - p, 4);
          angulo = final * e;
          desenhar(angulo);
          const sob = Math.floor(((((-angulo) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2)) / passo);
          if (sob !== ultimaFatia) { ultimaFatia = sob; J.som.tique(); seta.classList.remove('bate'); void seta.offsetWidth; seta.classList.add('bate'); }
          if (p < 1) raf = requestAnimationFrame(quadro);
          else {
            terminou = true;
            if (raf) cancelAnimationFrame(raf);
            raf = null;
            area.querySelector('.rol-res').textContent = brinde ? brinde.nome : fatias[alvo].rotulo;
            if (brinde) { J.som.vitoria(); J.confete(1800); } else J.som.erro();
            timers.push(setTimeout(() => fim({ acertos: 0, total: 0, pontos: 0, tempoMs: Date.now() - t0, venceu: !!brinde, sorteou: true, brinde, esgotou }), 2200));
          }
        }
        quadro(ini);
      };
      btn.onclick = girar;
      cv.addEventListener('pointerup', girar);
    },
  };
})();
</script>
<script>/* nucleo/app.js */
/* ============================================================
   APP — monta o palco, encaixa na tela e liga tudo.
   Carregado por último.
   ============================================================ */
(function () {
  const J = window.J;
  const cfg = J.cfg;
  const palco = document.getElementById('palco');

  /* ---------- orientação e escala ---------- */
  function orientacao() {
    const o = (cfg.tela && cfg.tela.orientacao) || 'retrato';
    if (o === 'auto') return window.innerWidth > window.innerHeight ? 'paisagem' : 'retrato';
    return o;
  }
  function encaixar() {
    const o = orientacao();
    palco.classList.toggle('retrato', o === 'retrato');
    palco.classList.toggle('paisagem', o === 'paisagem');
    const W = o === 'retrato' ? 1080 : 1920;
    const H = o === 'retrato' ? 1920 : 1080;
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    palco.style.transform = `translate(-50%, -50%) scale(${s})`;
    palco.style.left = '50%';
    palco.style.top = '50%';
    palco.style.transformOrigin = 'center center';
    palco.style.marginLeft = palco.style.marginTop = '0';
  }
  window.addEventListener('resize', encaixar);
  encaixar();

  /* ---------- telas ---------- */
  ['espera', 'cadastro', 'leitura', 'jogo', 'resultado'].forEach((id) => {
    const s = document.createElement('section');
    s.className = 'tela';
    s.id = id;
    palco.appendChild(s);
  });
  const inativo = document.createElement('div');
  inativo.id = 'inativo';
  inativo.innerHTML = `<div class="caixa"><h2>Ainda está aí?</h2><div class="n">10</div><button class="btn largo">Continuar jogando</button></div>`;
  inativo.querySelector('button').onclick = () => J.inatividade.zerar();
  palco.appendChild(inativo);

  J.telas.espera.montar();
  if (cfg.cadastro && cfg.cadastro.ligado) J.telas.cadastro.montar();
  if (cfg.leitura && cfg.leitura.ligada) J.telas.leitura.montar();
  J.teclado.montar(palco);
  J.admin.montar(palco);

  if (window.__RASCUNHO__) {
    const r = document.createElement('div');
    r.id = 'rascunho';
    r.textContent = 'RASCUNHO — ' + window.__RASCUNHO__;
    palco.appendChild(r);
  }

  /* ---------- inatividade: qualquer toque zera ---------- */
  palco.addEventListener('pointerdown', () => { if (!document.getElementById('inativo').classList.contains('on')) J.inatividade.zerar(); }, true);

  // Bloqueia menu de toque longo e zoom de pinça num totem.
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('gesturestart', (e) => e.preventDefault());

  J.ir('espera');
})();
</script>
</body></html>
